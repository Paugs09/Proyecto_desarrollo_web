<div class="bg-[#FBF5EC] min-h-screen flex items-center justify-center px-4 py-10">
  <div class="bg-white rounded-xl shadow-md w-full max-w-md p-8">
    
    <h1 class="text-3xl font-bold text-center text-[#2D5016] mb-6">
      Regístrate
    </h1>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">

      <div class="flex flex-col items-center justify-center mb-8">
  <div class="relative group">
    <div class="w-32 h-32 rounded-full border-4 border-[#F4A261] overflow-hidden bg-[#FBF5EC] shadow-xl flex items-center justify-center relative">
      
      @if (isUploadingImage()) {
        <div class="absolute inset-0 bg-white/80 flex flex-col items-center justify-center z-10">
          <div class="animate-spin rounded-full h-8 w-8 border-4 border-[#2D5016] border-t-transparent mb-2"></div>
          <span class="text-[8px] font-bold text-[#2D5016] animate-pulse">SUBIENDO...</span>
        </div>
      }
      
      @if (fotoUrl()) {
        <img [src]="fotoUrl()" class="w-full h-full object-cover animate-in fade-in duration-500">
      } 
      @else {
        <div class="flex flex-col items-center opacity-30">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-gray-400" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
          </svg>
        </div>
      }
    </div>

    <label for="avatar-input" 
    class="absolute -bottom-1 -right-1 bg-[#4f8c27] text-white rounded-full cursor-pointer hover:bg-[#1a310d] transition-all shadow-md hover:scale-110 active:scale-95 w-12 h-12 flex items-center justify-center overflow-hidden border-2 border-white">
    
    <img src="../../../../assets/hormiguita.png" alt="Cambiar foto" class="w-full h-full object-cover">
  </label>
    
    <input type="file" id="avatar-input" class="hidden" (change)="onFileSelected($event)" accept="image/*">
  </div>

  @if (fotoUrl()) {
    <p class="text-[10px] font-black text-green-600 mt-2 uppercase tracking-widest flex items-center gap-1">
      <span class="text-xs">✓</span> Foto cargada con éxito
    </p>
  } @else {
    <p class="text-[10px] font-bold text-gray-400 mt-2 uppercase tracking-widest">Sube tu foto de perfil</p>
  }
</div>
      
      <div>
        <label for="firstName" class="block text-sm font-medium mb-1">Nombre</label>
        <!--VALIDACIÓN FRONTEND -->
        <input
          id="firstName"
          type="text"
          formControlName="firstName"
          placeholder="Tu nombre"
          [class.border-red-500]="isFieldInvalid('firstName')"
          class="w-full bg-[#FBF5EC] border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#F4A261] transition"
        />
      </div>

      <div>
        <label for="lastName" class="block text-sm font-medium mb-1">Apellidos</label>
        <!--VALIDACIÓN FRONTEND -->
        <input
          id="lastName"
          type="text"
          formControlName="lastName"
          placeholder="Tus apellidos"
          [class.border-red-500]="isFieldInvalid('lastName')"
          class="w-full bg-[#FBF5EC] border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#F4A261] transition"
        />
      </div>

      <div>
        <label for="phone" class="block text-sm font-medium mb-1">Número Telefónico</label>
        <input
          id="phone"
          type="tel"
          formControlName="phone"
          placeholder="Ej: +57..."
          class="w-full bg-[#FBF5EC] border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#F4A261] transition"
        />
      </div>

      <div>
        <label for="email" class="block text-sm font-medium mb-1">Correo Electrónico</label>
        
        <!--VALIDACIÓN FRONTEND -->
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="ejemplo@correo.com"
          [class.border-red-500]="isFieldInvalid('email')"
          class="w-full bg-[#FBF5EC] border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#F4A261] transition"
        />
      </div>

      <div>
        <label for="password" class="block text-sm font-medium mb-1">Contraseña</label>
        <div class="relative">
          <!--VALIDACIÓN FRONTEND -->
          <input
            id="password"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            placeholder="Mínimo 6 caracteres"
            [class.border-red-500]="isFieldInvalid('password')"
            class="w-full bg-[#FBF5EC] border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#F4A261] transition"
          />
          <button 
            type="button" 
            (click)="togglePasswordVisibility()"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-[#2D5016] opacity-60 hover:opacity-100"
          >
            @if (showPassword()) {
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-4.803m5.596-3.856a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            } @else {
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
            }
          </button>
        </div>
      </div>

      <div>
        <label for="shippingAddress" class="block text-sm font-medium mb-1">Dirección de Envío <span class="text-gray-500">(opcional)</span></label>
        <textarea
          id="shippingAddress"
          formControlName="shippingAddress"
          rows="2"
          placeholder="Calle, ciudad..."
          class="w-full bg-[#FBF5EC] border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#F4A261] transition"
        ></textarea>
      </div>

      <!--VALIDACIÓN FRONTEND: Deshabilitación del botón de envío si el formulario contiene errores -->
      <button
        type="submit"
        [disabled]="form.invalid || isLoading()"
        class="w-full font-semibold py-2 rounded bg-[#F4A261] text-[#2D5016] hover:opacity-90 disabled:opacity-50 disabled:cursor-not-allowed transition"
      >
        @if (isLoading()) {
          Registrando...
        } @else {
          Registrar
        }
      </button>

    </form>

    <p class="text-center text-sm mt-6">
      ¿Ya tienes cuenta?
      <a routerLink="/login" class="text-green-700 font-semibold hover:underline cursor-pointer">
        Inicia sesión
      </a>
    </p>

  </div>
</div>
