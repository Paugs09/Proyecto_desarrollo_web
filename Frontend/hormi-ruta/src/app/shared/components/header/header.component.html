<header class="bg-[#3aa394] text-white shadow-md sticky top-0 z-50">

<div class="flex items-center justify-between px-6 py-3">
    <!-- Logo -->
    <div class="flex items-center gap-3">
      <img src="assets/logo_HormiGuane.png" alt="HormiGuane" class="h-10 w-auto object-contain">

      <a href="/home">
        <span class="logo-text text-2xl font-serif italic">HormiGuane</span>
      </a>
      
    </div>

    <!-- Nav -->
    <nav class="hidden md:flex items-center gap-2">

      <a routerLink="/home" class="text-white font-medium text-sm px-4 py-2 rounded-full bg-black/25 hover:bg-black/35 transition no-underline">Conócenos</a>

      <a routerLink="/login" class="text-white font-medium text-sm px-4 py-2 rounded-lg hover:bg-white/15 transition no-underline">Inicia Sesión</a>

      <a routerLink="/register" class="text-white font-medium text-sm px-4 py-2 rounded-lg hover:bg-white/15 transition no-underline">Regístrate</a>

      <!-- Carrito -->
      <a routerLink="/cart" title="Carrito"
         class="text-white p-2 rounded-lg hover:bg-white/15 transition ml-2">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
             stroke-width="2" stroke="currentColor" class="w-6 h-6">
           <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 1 0-7.5 0v4.5m11.356-1.993 1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 0 1-1.12-1.243l1.264-12A1.125 1.125 0 0 1 5.513 7.5h12.974c.576 0 1.059.435 1.119 1.007ZM8.625 10.5a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm7.5 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
        </svg>
      </a>

      <!-- Perfil -->
      <a routerLink="/profile" title="Perfil"
         class="flex items-center gap-1 text-white px-3 py-1.5 rounded-full
                border-2 border-white/60 hover:bg-white/15 transition ml-1">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
             stroke-width="2" stroke="currentColor" class="w-6 h-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
        </svg>
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
             stroke-width="3" stroke="currentColor" class="w-3 h-3">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
        </svg>
      </a>

    </nav>

    <!-- Botón hamburguesa -->
    <button (click)="toggleMenu()"
            class="md:hidden flex flex-col gap-1.5 p-2 rounded-lg
                   hover:bg-white/15 transition cursor-pointer">
      <span class="block w-6 h-0.5 bg-white rounded transition-all duration-300"
            [ngClass]="menuOpen ? 'translate-y-2 rotate-45' : ''"></span>
      <span class="block w-6 h-0.5 bg-white rounded transition-all duration-300"
            [ngClass]="menuOpen ? 'opacity-0' : ''"></span>
      <span class="block w-6 h-0.5 bg-white rounded transition-all duration-300"
            [ngClass]="menuOpen ? '-translate-y-2 -rotate-45' : ''"></span>
    </button>

  </div>

  <!-- Menú móvil -->
  <div class="md:hidden overflow-hidden transition-all duration-300"
      [ngClass]="menuOpen ? 'max-h-96 py-3' : 'max-h-0'">
    <div class="flex flex-col px-6 bg-[#2e8a7d]">

      <a routerLink="/home" (click)="closeMenu()"
        class="text-white font-medium py-3 border-b border-white/15
                hover:text-white/75 transition no-underline">
        Conócenos
      </a>

      <a routerLink="/login" (click)="closeMenu()"
        class="text-white font-medium py-3 border-b border-white/15
                hover:text-white/75 transition no-underline">
        Inicia Sesión
      </a>

      <a routerLink="/register" (click)="closeMenu()"
        class="text-white font-medium py-3 border-b border-white/15
                hover:text-white/75 transition no-underline">
        Regístrate
      </a>

      <div class="flex gap-4 py-3">

        <a routerLink="/cart" (click)="closeMenu()"
          class="text-white p-2 rounded-lg hover:bg-white/15 transition">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
              stroke-width="2" stroke="currentColor" class="w-6 h-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 1 0-7.5 0v4.5m11.356-1.993 1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 0 1-1.12-1.243l1.264-12A1.125 1.125 0 0 1 5.513 7.5h12.974c.576 0 1.059.435 1.119 1.007ZM8.625 10.5a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm7.5 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
          </svg>
        </a>

        <a routerLink="/profile" (click)="closeMenu()"
          class="text-white p-2 rounded-lg hover:bg-white/15 transition">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
              stroke-width="2" stroke="currentColor" class="w-6 h-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
          </svg>
        </a>
      </div>
    </div>
  </div>
</header>
