<header class="bg-[#3aa394] text-white shadow-md sticky top-0 z-201">

  <div class="flex items-center justify-between px-6 py-3">
    <!-- Logo -->
    <div class="flex items-center gap-3">
      <img src="assets/logo_HormiGuane.png" alt="HormiGuane" class="h-10 w-auto object-contain">

      <a routerLink="/home">
        <span class="logo-text text-2xl font-serif italic">HormiGuane</span>
      </a>

    </div>

    <!-- Nav -->
    <nav class="hidden md:flex items-center gap-2">

      <a *ngIf="isAdmin()" routerLink="/admin/crear-producto" class="inline-flex items-center gap-2 text-white font-medium text-sm px-4 py-2 rounded-full bg-black/25 hover:bg-black/35 transition no-underline">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
        </svg>
        Crear producto
      </a>

      <a routerLink="/home"
        class="text-white font-medium text-sm px-4 py-2 rounded-lg hover:bg-white/15 transition no-underline">Conócenos</a>

      <a routerLink="/login"
        class="text-white font-medium text-sm px-4 py-2 rounded-lg hover:bg-white/15 transition no-underline">Inicia
        Sesión</a>

      <a routerLink="/register"
        class="text-white font-medium text-sm px-4 py-2 rounded-lg hover:bg-white/15 transition no-underline">Regístrate</a>

      <!-- Carrito -->
      <a routerLink="/cart" title="Carrito" class="text-white p-2 rounded-lg hover:bg-white/15 transition ml-2">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"
          class="w-6 h-6">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
        </svg>
      </a>

      <!-- Perfil -->
      <div class="relative ml-1">
        <button (click)="profileOpen = !profileOpen"
          class="flex items-center gap-2 text-white px-3 py-1.5 rounded-full border-2 border-white/60 hover:bg-white/15 transition">

          <img *ngIf="user()?.avatar; else iconoPerfil"
              [src]="user()?.avatar"
              [alt]="user()?.firstName"
              class="w-8 h-8 rounded-full object-cover border-2 border-white/70">
          <ng-template #iconoPerfil>
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
            </svg>
          </ng-template>

          <span class="text-sm font-medium" *ngIf="user()">
            {{ user()?.firstName }} {{ user()?.lastName }}
          </span>

          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="3" stroke="currentColor"
            class="w-3 h-3 transition-transform duration-200" [ngClass]="profileOpen ? 'rotate-180' : ''">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
          </svg>
        </button>

        <div *ngIf="profileOpen" class="fixed inset-0 z-40" (click)="profileOpen = false"></div>

        <!-- Dropdown -->
        <div *ngIf="profileOpen"
          class="absolute right-0 mt-3 w-64 bg-white rounded-2xl shadow-xl z-50 overflow-hidden border border-gray-100">

          <!-- Cabecera -->
          <div class="flex flex-col items-center pt-6 pb-4 px-6 bg-white">
            <div class="relative">
              <img *ngIf="user()?.avatar; else avatarDropdown"
                  [src]="user()?.avatar"
                  [alt]="user()?.firstName"
                  class="w-20 h-20 rounded-full object-cover border-2 border-gray-200">
              <ng-template #avatarDropdown>
                <div class="w-20 h-20 rounded-full bg-[#3aa394]/20 flex items-center justify-center">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="#3aa394" class="w-10 h-10">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
                  </svg>
                </div>
              </ng-template>
            </div>
            <p class="text-xs text-gray-400 mt-3">¡Hola HormiUsuario!</p>
            <h2 class="text-base font-semibold text-gray-800">{{ user()?.firstName }} {{ user()?.lastName }}</h2>
          </div>

          <hr class="border-gray-100">

          <!-- Opciones -->
          <nav class="p-3 space-y-1">
            <a routerLink="/profile" (click)="profileOpen = false"
              class="flex items-center gap-3 px-4 py-2.5 rounded-full text-gray-700 hover:bg-[#3aa394]/10 hover:text-[#3aa394] transition no-underline text-sm font-medium">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
              </svg>
              Mi perfil
            </a>

            <button (click)="logout()"
              class="w-full flex items-center gap-3 px-4 py-2.5 rounded-full text-red-500 hover:bg-red-50 transition text-sm font-medium">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15M12 9l-3 3m0 0 3 3m-3-3h12.75" />
              </svg>
              Cerrar sesión
            </button>
          </nav>
        </div>
      </div>

    </nav>

    <!-- Botón hamburguesa -->
    <button (click)="toggleMenu()" class="md:hidden flex flex-col gap-1.5 p-2 rounded-lg
                   hover:bg-white/15 transition cursor-pointer">
      <span class="block w-6 h-0.5 bg-white rounded transition-all duration-300"
        [ngClass]="menuOpen ? 'translate-y-2 rotate-45' : ''"></span>
      <span class="block w-6 h-0.5 bg-white rounded transition-all duration-300"
        [ngClass]="menuOpen ? 'opacity-0' : ''"></span>
      <span class="block w-6 h-0.5 bg-white rounded transition-all duration-300"
        [ngClass]="menuOpen ? '-translate-y-2 -rotate-45' : ''"></span>
    </button>

  </div>

   <!-- Menú móvil -->
  <div class="md:hidden overflow-hidden transition-all duration-300" [ngClass]="menuOpen ? 'max-h-screen py-3' : 'max-h-0'">
    <div class="flex flex-col px-6 bg-[#2e8a7d]">

      <a *ngIf="isAdmin()" routerLink="/admin/crear-producto" (click)="closeMenu()"
        class="text-white font-medium py-3 border-b border-white/15 hover:text-white/75 transition no-underline">
        Crear productos
      </a>

      <a routerLink="/home" (click)="closeMenu()"
        class="text-white font-medium py-3 border-b border-white/15 hover:text-white/75 transition no-underline">
        Conócenos
      </a>

      <a routerLink="/login" (click)="closeMenu()"
        class="text-white font-medium py-3 border-b border-white/15 hover:text-white/75 transition no-underline">
        Inicia Sesión
      </a>

      <a routerLink="/register" (click)="closeMenu()"
        class="text-white font-medium py-3 border-b border-white/15 hover:text-white/75 transition no-underline">
        Regístrate
      </a>

      <!-- Carrito -->
      <a routerLink="/cart" (click)="closeMenu()"
        class="flex items-center gap-3 text-white font-medium py-3 border-b border-white/15 hover:text-white/75 transition no-underline">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
        </svg>
        Carrito
      </a>

      <!-- Perfil con dropdown -->
      <div class="relative py-3">
        <button (click)="profileOpen = !profileOpen"
          class="flex items-center gap-3 w-full text-white font-medium hover:text-white/75 transition">

          <img *ngIf="user()?.avatar; else iconoMovil"
              [src]="user()?.avatar"
              [alt]="user()?.firstName"
              class="w-8 h-8 rounded-full object-cover border-2 border-white/70 flex-shrink-0">
          <ng-template #iconoMovil>
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 flex-shrink-0">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
            </svg>
          </ng-template>

          <span class="flex-1 text-left text-sm">
            {{ user() ? (user()?.firstName + ' ' + user()?.lastName) : 'Mi perfil' }}
          </span>

          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="3" stroke="currentColor"
            class="w-3 h-3 transition-transform duration-200 flex-shrink-0" [ngClass]="profileOpen ? 'rotate-180' : ''">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
          </svg>
        </button>

        <!-- Overlay -->
        <div *ngIf="profileOpen" class="fixed inset-0 z-40" (click)="profileOpen = false"></div>

        <!-- Dropdown card móvil -->
        <div *ngIf="profileOpen"   
        class="fixed left-4 right-4 mt-2 bg-white rounded-2xl shadow-xl z-50 overflow-hidden border border-gray-100" style="top: auto;">
          <div class="flex flex-col items-center pt-6 pb-4 px-6">
            <img *ngIf="user()?.avatar; else avatarDropdownMovil"
                [src]="user()?.avatar"
                [alt]="user()?.firstName"
                class="w-20 h-20 rounded-full object-cover border-2 border-gray-200">
            <ng-template #avatarDropdownMovil>
              <div class="w-20 h-20 rounded-full bg-[#3aa394]/20 flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="#3aa394" class="w-10 h-10">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
                </svg>
              </div>
            </ng-template>
            <p class="text-xs text-gray-400 mt-3">¡Hola HormiUsuario!</p>
            <h2 class="text-base font-semibold text-gray-800">{{ user()?.firstName }} {{ user()?.lastName }}</h2>
          </div>

          <hr class="border-gray-100">

          <nav class="p-3 space-y-1">
            <a routerLink="/profile" (click)="profileOpen = false; closeMenu()"
              class="flex items-center gap-3 px-4 py-2.5 rounded-full text-gray-700 hover:bg-[#3aa394]/10 hover:text-[#3aa394] transition no-underline text-sm font-medium">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
              </svg>
              Mi perfil
            </a>

            <button (click)="logout()"
              class="w-full flex items-center gap-3 px-4 py-2.5 rounded-full text-red-500 hover:bg-red-50 transition text-sm font-medium">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15M12 9l-3 3m0 0 3 3m-3-3h12.75" />
              </svg>
              Cerrar sesión
            </button>
          </nav>
        </div>
      </div>

    </div>
  </div>
</header>
