<div class="bg-[#FBF5EC] min-h-screen flex items-center justify-center px-4 py-10">

  
  <div class="bg-white rounded-xl shadow-md w-full max-w-md p-8">

    <!-- Título -->
    <h1 class="text-3xl font-bold text-center text-[#2D5016] mb-6">
      Regístrate
    </h1>

    <!-- Formulario -->
    <form class="space-y-4">

      <!-- Primer nombre class="w-full bg-[#FBF5EC] border rounded px-3 py-2 focus:outline-none" -->
      <div>
        <label class="block text-sm font-medium mb-1">Primer Nombre</label>
        <input
          type="text"
          placeholder="Value"
          class="w-full bg-[#FBF5EC] border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#F4A261]"
        />
      </div>

      <!-- Segundo nombre -->
      <div>
        <label class="block text-sm font-medium mb-1">
          Segundo Nombre <span class="text-gray-500">(opcional)</span>
        </label>
        <input
          type="text"
          placeholder="Value"
          class="w-full bg-[#FBF5EC] border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#F4A261]"
        />
      </div>

      <!-- Apellidos -->
      <div>
        <label class="block text-sm font-medium mb-1">Apellidos</label>
        <input
          type="text"
          placeholder="Value"
          class="w-full bg-[#FBF5EC] border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#F4A261]"
        />
      </div>

      <!-- Identificacion -->
      <div>
        <label class="block text-sm font-medium mb-1">Número Identificación</label>
        <input
          type="text"
          placeholder="Value"
          class="w-full bg-[#FBF5EC] border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#F4A261]"
        />
      </div>

      <!-- Telefono -->
      <div>
        <label class="block text-sm font-medium mb-1">Número Telefónico</label>
        <input
          type="text"
          placeholder="Value"
          class="w-full bg-[#FBF5EC] border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#F4A261]"
        />
      </div>

      <!-- Correo -->
      <div>
        <label class="block text-sm font-medium mb-1">Correo Electrónico</label>
        <input
          type="email"
          placeholder="Value"
          class="w-full bg-[#FBF5EC] border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#F4A261]"
        />
      </div>

      <!-- Contraseña -->
      <div>
        <label class="block text-sm font-medium mb-1">Contraseña</label>
        <input
          type="password"
          placeholder="Value"
          class="w-full bg-[#FBF5EC] border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#F4A261]"
        />
      </div>

      <!-- Botón -->
      <button
        type="submit"
        class="w-full font-semibold py-2 rounded bg-[#F4A261] text-[#2D5016] hover:opacity-90 transition"
>
        Registrar
      </button>

    </form>

    
    <p class="text-center text-sm mt-4">
      ¿Ya tienes cuenta?
      <span class="text-green-700 font-semibold cursor-pointer">
        Inicia sesión
      </span>
    </p>

  </div>

</div>
